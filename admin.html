<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>WALAA Beauty - الإدارة</title>

<style>

body{font-family:Arial;background:#f8f3f6;color:#382536;margin:0;padding:20px}

header{text-align:center;background:#8e4778;color:white;padding:20px;border-radius:15px}

main{max-width:450px;margin:30px auto}

.card{background:white;padding:22px;border-radius:15px}

input,button{box-sizing:border-box;width:100%;padding:14px;margin:9px 0;border:1px solid #ddd;border-radius:9px;font-size:16px}

button{background:#8e4778;color:white;border:0;font-weight:bold}

#message{white-space:pre-wrap;overflow-wrap:anywhere}

</style>

</head>

<body>

<header>

<h1>WALAA Beauty</h1>

<p>لوحة تحكم الإدارة</p>

</header>

<main>

<div class="card">

<h2>تسجيل دخول المدير</h2>

<input id="email" type="email" placeholder="البريد الإلكتروني">

<input id="password" type="password" placeholder="كلمة المرور">

<button id="loginBtn">تسجيل الدخول</button>

<p id="message">جاري تحميل النظام...</p>

</div>

</main>

<script type="module">

const msg = document.getElementById('message');

const btn = document.getElementById('loginBtn');

try {

  msg.textContent = 'جاري تحميل النظام...';

  const { createClient } = await import(

    'https://esm.sh/@supabase/supabase-js@2'

  );

  const supabase = createClient(

    'https://gqzsrohssrzprfqxjajp.supabase.co',

    'sb_publishable_WR1BKSI9cEDKRcS8NqDUFg_MHaFM7VL'

  );

  msg.textContent = 'النظام جاهز لتسجيل الدخول';

  btn.addEventListener('click', async () => {

    try {

      const email = document.getElementById('email').value.trim();

      const password = document.getElementById('password').value;

      if (!email || !password) {

        msg.textContent = 'اكتب البريد الإلكتروني وكلمة المرور';

        return;

      }

      btn.disabled = true;

      msg.textContent = 'جارٍ التحقق من الحساب...';

      const {data, error} = await supabase.auth.signInWithPassword({

        email,

        password

      });

      if (error) throw error;

      const {data: admin, error: adminError} = await supabase

        .from('store_admins')

        .select('user_id')

        .eq('user_id', data.user.id)

        .maybeSingle();

      if (adminError) throw adminError;

      if (!admin) {

        await supabase.auth.signOut();

        throw new Error('الحساب ليس لديه صلاحية الإدارة');

      }

      msg.textContent = 'تم تسجيل الدخول بنجاح.';

    } catch (error) {

      msg.textContent = 'خطأ: ' + error.message;

    } finally {

      btn.disabled = false;

    }

  });

} catch (error) {

  msg.textContent = 'فشل تحميل النظام: ' + error.message;

}

</script>

</body>

</html>
