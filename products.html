
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>إدارة المنتجات - WALAA Beauty</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{font-family:Arial;background:#fff5fa;margin:0;padding:18px;color:#333}
.container{max-width:850px;margin:auto}
h2{color:#c04480;text-align:center}
.card{background:white;padding:18px;border-radius:15px;margin-bottom:18px;box-shadow:0 2px 10px #0001}
input,textarea,select{width:100%;padding:12px;margin:7px 0 12px;border:1px solid #ddd;border-radius:8px;font-size:16px}
button{border:0;padding:11px 17px;border-radius:8px;cursor:pointer;font-size:15px}
.save{background:#c04480;color:white;width:100%}
.edit{background:#f0a52b;color:white}
.delete{background:#d94343;color:white}
.cancel{background:#777;color:white}
.product{display:flex;gap:12px;align-items:center;border-bottom:1px solid #eee;padding:12px 0}
.product img{width:85px;height:85px;object-fit:cover;border-radius:10px}
.details{flex:1;min-width:0}
.details p{margin:5px 0}
.actions{display:flex;gap:6px;flex-wrap:wrap}
small{color:#777}
</style>
</head>
<body>
<div class="container">

<h2>WALAA Beauty</h2>
<h3 style="text-align:center">إدارة المنتجات والأقسام</h3>

<div class="card">
<h3 id="formTitle">إضافة منتج جديد</h3>

<label>اسم المنتج</label>
<input id="name" placeholder="اسم المنتج">

<label>وصف المنتج</label>
<textarea id="description" placeholder="وصف المنتج"></textarea>

<label>السعر</label>
<input id="price" type="number" min="0" placeholder="السعر">

<label>سعر الخصم (اختياري)</label>
<input id="sale_price" type="number" min="0" placeholder="سعر الخصم">

<label>القسم</label>
<select id="category_id">
<option value="">اختر القسم</option>
</select>

<label>الكمية المتاحة</label>
<input id="stock" type="number" min="0" value="0">

<label>صورة المنتج</label>
<input id="image" type="file" accept="image/*">

<label>
<input id="is_active" type="checkbox" checked style="width:auto">
 المنتج نشط ويظهر للعملاء
</label>

<button class="save" onclick="saveProduct()">حفظ المنتج</button>
<button class="cancel" onclick="resetForm()" style="width:100%;margin-top:8px">إلغاء التعديل</button>
<p id="message"></p>
</div>

<div class="card">
<h3>المنتجات الحالية</h3>
<div id="productsList">جاري تحميل المنتجات...</div>
</div>

</div>

<script>
const SUPABASE_URL = 'https://pdgacxtalsihplalxzem.supabase.co';


const SUPABASE_KEY = 'sb_publishable_WR1BKSI9cEDKRcS8NqDUFg_MHaFM7VL';

const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentProductId = null;
let currentImageUrl = null;

async function checkAdmin(){
  const {data:{session},error} = await db.auth.getSession();

  if(error || !session){
    location.href = 'admin.html';
    return false;
  }

  const {data,error:adminError} = await db
    .from('store_admins')
    .select('user_id')
    .eq('user_id',session.user.id)
    .maybeSingle();

  if(adminError || !data){
    document.body.innerHTML =
      '<h3 style="text-align:center;color:red">الحساب غير مسجل كمدير</h3>';
    return false;
  }

  return true;
}

async function loadCategories(){
  const select = document.getElementById('category_id');

  const {data,error} = await db
    .from('categories')
    .select('id,name')
    .order('name');

  if(error){
    alert('خطأ في تحميل الأقسام: ' + error.message);
    return;
  }

  select.innerHTML = '<option value="">اختر القسم</option>';

  (data || []).forEach(category=>{
    const option = document.createElement('option');
    option.value = category.id;
    option.textContent = category.name;
    select.appendChild(option);
  });
}

async function loadProducts(){
  const list = document.getElementById('productsList');
  list.textContent = 'جاري تحميل المنتجات...';

  const {data,error} = await db
    .from('products')
    .select('id,name,description,price,sale_price,image_url,category_id,stock,is_active,categories(name)')
    .order('id',{ascending:false});

  if(error){
    list.textContent = 'خطأ: ' + error.message;
    return;
  }

  if(!data || data.length===0){
    list.textContent = 'لا توجد منتجات حتى الآن';
    return;
  }

  list.innerHTML = '';

  data.forEach(product=>{
    const item = document.createElement('div');
    item.className = 'product';

    const img = document.createElement('img');
    img.src = product.image_url || '';
    img.alt = product.name || 'صورة المنتج';

    const details = document.createElement('div');
    details.className = 'details';

    const name = document.createElement('strong');
    name.textContent = product.name || '';

    const price = document.createElement('p');
    price.textContent = 'السعر: ' + product.price + ' جنيه';

    const category = document.createElement('small');
    category.textContent = 'القسم: ' +
      (product.categories?.name || 'بدون قسم');

    const stock = document.createElement('p');
    stock.textContent = 'المخزون: ' + (product.stock ?? 0);

    const actions = document.createElement('div');
    actions.className = 'actions';

    const edit = document.createElement('button');
    edit.className = 'edit';
    edit.textContent = 'تعديل';
    edit.onclick = ()=>editProduct(product);

    const del = document.createElement('button');
    del.className = 'delete';
    del.textContent = 'حذف';
    del.onclick = ()=>deleteProduct(product.id);

    details.append(name,price,category,stock,actions);
    actions.append(edit,del);
    item.append(img,details);
    list.appendChild(item);
  });
}

async function saveProduct(){
  const message = document.getElementById('message');
  message.textContent = 'جاري الحفظ...';

  const name = document.getElementById('name').value.trim();
  const description = document.getElementById('description').value.trim();
  const price = Number(document.getElementById('price').value);
  const saleValue = document.getElementById('sale_price').value;
  const sale_price = saleValue === '' ? null : Number(saleValue);
  const categoryValue = document.getElementById('category_id').value;
  const category_id = categoryValue || null;
  const stock = Number(document.getElementById('stock').value);
  const is_active = document.getElementById('is_active').checked;
  const file = document.getElementById('image').files[0];

  if(!name || document.getElementById('price').value === '' || price < 0){
    message.textContent = 'من فضلك اكتب اسم المنتج وسعر صحيح';
    return;
  }

  if(sale_price !== null && (sale_price < 0 || sale_price > price)){
    message.textContent = 'راجع سعر الخصم';
    return;
  }

  if(stock < 0){
    message.textContent = 'الكمية غير صحيحة';
    return;
  }

  let image_url = currentImageUrl;

  if(file){
    const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
    const filePath = Date.now() + '_' + safeName;

    const {error:uploadError} = await db.storage
      .from('product-images')
      .upload(filePath,file,{upsert:false});

    if(uploadError){
      message.textContent = 'فشل رفع الصورة: ' + uploadError.message;
      return;
    }

    const {data:urlData} = db.storage
      .from('product-images')
      .getPublicUrl(filePath);

    image_url = urlData.publicUrl;
  }

  const productData = {
    name,
    description,
    price,
    sale_price,
    category_id,
    stock,
    is_active,
    image_url
  };

  let result;

  if(currentProductId){
    result = await db.from('products')
      .update(productData)
      .eq('id',currentProductId);
  }else{
    result = await db.from('products')
      .insert([productData]);
  }

  if(result.error){
    message.textContent = 'خطأ في الحفظ: ' + result.error.message;
    return;
  }

  message.textContent = 'تم حفظ المنتج بنجاح ❤️';
  resetForm();
  await loadProducts();
}

function editProduct(product){
  currentProductId = product.id;
  currentImageUrl = product.image_url;

  document.getElementById('formTitle').textContent = 'تعديل المنتج';
  document.getElementById('name').value = product.name || '';
  document.getElementById('description').value = product.description || '';
  document.getElementById('price').value = product.price ?? '';
  document.getElementById('sale_price').value = product.sale_price ?? '';
  document.getElementById('category_id').value = product.category_id || '';
  document.getElementById('stock').value = product.stock ?? 0;
  document.getElementById('is_active').checked = product.is_active;

  document.getElementById('message').textContent =
    'أنت تعدل المنتج: ' + product.name;

  window.scrollTo({top:0,behavior:'smooth'});
}

function resetForm(){
  currentProductId = null;
  currentImageUrl = null;

  document.getElementById('formTitle').textContent = 'إضافة منتج جديد';
  document.getElementById('name').value = '';
  document.getElementById('description').value = '';
  document.getElementById('price').value = '';
  document.getElementById('sale_price').value = '';
  document.getElementById('category_id').value = '';
  document.getElementById('stock').value = 0;
  document.getElementById('image').value = '';
  document.getElementById('is_active').checked = true;
}

async function deleteProduct(id){
  if(!confirm('هل أنت متأكد من حذف المنتج؟')) return;

  const {error} = await db
    .from('products')
    .delete()
    .eq('id',id);

  if(error){
    alert('فشل الحذف: ' + error.message);
    return;
  }

  alert('تم حذف المنتج');
  await loadProducts();
}

async function start(){
  const allowed = await checkAdmin();
  if(!allowed) return;

  await loadCategories();
  await loadProducts();
}

start();
</script>
</body>
</html>
