
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>إدارة المنتجات - WALAA Beauty</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial;background:#fff5fa;margin:0;padding:18px;color:#333}
.container{max-width:650px;margin:auto}
h2{text-align:center;color:#bd4b83}
.box,.product{background:white;padding:16px;border-radius:14px;margin:14px 0;box-shadow:0 2px 10px #ead5e0}
input,textarea,button{width:100%;box-sizing:border-box;padding:12px;margin:7px 0;border:1px solid #ddd;border-radius:8px;font-size:16px}
button{background:#bd4b83;color:white;border:0;font-weight:bold}
.product img{width:110px;height:110px;object-fit:cover;border-radius:8px}
#status{white-space:pre-wrap;color:#a33}
</style>
</head>
<body>
<div class="container">
<h2>WALAA Beauty</h2>
<h3>إدارة المنتجات</h3>

<div class="box">
<h3 id="formTitle">إضافة منتج جديد</h3>
<input id="name" placeholder="اسم المنتج">
<textarea id="description" placeholder="وصف المنتج"></textarea>
<input id="price" type="number" placeholder="السعر">
<input id="sale_price" type="number" placeholder="سعر الخصم (اختياري)">
<input id="stock" type="number" placeholder="الكمية بالمخزون">
<label>صورة المنتج:</label>
<input id="imageFile" type="file" accept="image/*">
<img id="preview" style="display:none;width:120px;margin:10px;border-radius:10px">
<label><input id="active" type="checkbox" checked style="width:auto"> عرض المنتج في المتجر</label>
<button onclick="saveProduct()">حفظ المنتج</button>
<button onclick="resetForm()" style="background:#777">إلغاء التعديل</button>
<p id="status"></p>
</div>

<h3>المنتجات الحالية</h3>
<div id="productsList">جاري تحميل المنتجات...</div>
<button onclick="location.href='dashboard.html'">العودة للوحة التحكم</button>
</div>

<script>
const SUPABASE_URL = 'https://pdgacxtalsihplalxzem.supabase.co';
const SUPABASE_KEY = 'ضعsb_publishable_WR1BKSI9cEDKRcS8NqDUFg_MHaFM7VL';
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let editingId = null;
let oldImageUrl = null;
let selectedFile = null;

const $ = id => document.getElementById(id);

$('imageFile').addEventListener('change', () => {
  selectedFile = $('imageFile').files[0] || null;
  if(selectedFile){
    $('preview').src = URL.createObjectURL(selectedFile);
    $('preview').style.display = 'block';
  }
});

async function checkAdmin(){
  const {data:{session},error} = await db.auth.getSession();

  if(error || !session){
    location.href = 'admin.html';
    return false;
  }

  const {data,error:adminError} = await db
    .from('store_admins')
    .select('user_id')
    .eq('user_id',session.user.id)
    .maybeSingle();

  if(adminError){
    $('status').textContent = 'خطأ التحقق من المدير: ' + adminError.message;
    return false;
  }

  if(!data){
    $('status').textContent = 'الحساب غير مسجل كمدير';
    return false;
  }

  return true;
}

async function loadProducts(){
  const {data,error} = await db.from('products')
    .select('*').order('id',{ascending:false});

  if(error){
    $('productsList').textContent = 'خطأ: ' + error.message;
    return;
  }

  $('productsList').innerHTML = '';

  if(!data || !data.length){
    $('productsList').textContent = 'لا توجد منتجات';
    return;
  }

  data.forEach(p => {
    const item = document.createElement('div');
    item.className = 'product';

    if(p.image_url){
      const img = document.createElement('img');
      img.src = p.image_url;
      img.alt = p.name || 'صورة المنتج';
      item.appendChild(img);
    }

    const title = document.createElement('h3');
    title.textContent = p.name || '';
    item.appendChild(title);

    const details = document.createElement('p');
    details.textContent = `السعر: ${p.price} جنيه | المخزون: ${p.stock}`;
    item.appendChild(details);

    const edit = document.createElement('button');
    edit.textContent = 'تعديل';
    edit.onclick = () => editProduct(p);
    item.appendChild(edit);

    const del = document.createElement('button');
    del.textContent = 'حذف';
    del.style.background = '#a33';
    del.onclick = () => deleteProduct(p.id);
    item.appendChild(del);

    $('productsList').appendChild(item);
  });
}

async function saveProduct(){
  $('status').textContent = '';

  const name = $('name').value.trim();
  const price = Number($('price').value);
  const stock = Number($('stock').value);

  if(!name || $('price').value === '' || $('stock').value === ''){
    $('status').textContent = 'اكتب اسم المنتج والسعر والكمية';
    return;
  }

  if(price < 0 || stock < 0){
    $('status').textContent = 'السعر والكمية لا يمكن أن يكونا بالسالب';
    return;
  }

  const {data:{session}} = await db.auth.getSession();
  if(!session){
    location.href = 'admin.html';
    return;
  }

  let imageUrl = oldImageUrl;

  if(selectedFile){
    if(!selectedFile.type.startsWith('image/')){
      $('status').textContent = 'اختار صورة صالحة';
      return;
    }

    if(selectedFile.size > 5 * 1024 * 1024){
      $('status').textContent = 'حجم الصورة أكبر من 5 ميجابايت';
      return;
    }

    const ext = selectedFile.name.split('.').pop().toLowerCase();
    const filePath = `${session.user.id}/${Date.now()}-${Math.random().toString(36).slice(2)}.${ext}`;

    $('status').textContent = 'جاري رفع الصورة...';

    const {error:uploadError} = await db.storage
      .from('product-images')
      .upload(filePath,selectedFile,{contentType:selectedFile.type});

    if(uploadError){
      $('status').textContent = 'فشل رفع الصورة: ' + uploadError.message;
      return;
    }

    const {data:urlData} = db.storage
      .from('product-images')
      .getPublicUrl(filePath);

    imageUrl = urlData.publicUrl;
  }

  const product = {
    name,
    description: $('description').value.trim(),
    price,
    sale_price: $('sale_price').value === '' ? null : Number($('sale_price').value),
    stock,
    image_url: imageUrl,
    is_active: $('active').checked
  };

  let result;

  if(editingId){
    result = await db.from('products').update(product).eq('id',editingId);
  }else{
    result = await db.from('products').insert(product);
  }

  if(result.error){
    $('status').textContent = 'خطأ الحفظ: ' + result.error.message;
    return;
  }

  $('status').textContent = 'تم حفظ المنتج بنجاح ❤️';
  resetForm();
  await loadProducts();
}

function editProduct(p){
  editingId = p.id;
  oldImageUrl = p.image_url;

  $('name').value = p.name || '';
  $('description').value = p.description || '';
  $('price').value = p.price ?? '';
  $('sale_price').value = p.sale_price ?? '';
  $('stock').value = p.stock ?? 0;
  $('active').checked = p.is_active !== false;
  $('formTitle').textContent = 'تعديل المنتج';

  if(p.image_url){
    $('preview').src = p.image_url;
    $('preview').style.display = 'block';
  }else{
    $('preview').style.display = 'none';
  }

  selectedFile = null;
  $('imageFile').value = '';
  window.scrollTo({top:0,behavior:'smooth'});
}

function resetForm(){
  editingId = null;
  oldImageUrl = null;
  selectedFile = null;

  $('name').value = '';
  $('description').value = '';
  $('price').value = '';
  $('sale_price').value = '';
  $('stock').value = '';
  $('active').checked = true;
  $('imageFile').value = '';
  $('preview').style.display = 'none';
  $('formTitle').textContent = 'إضافة منتج جديد';
}

async function deleteProduct(id){
  if(!confirm('متأكد من حذف المنتج؟')) return;

  const {error} = await db.from('products').delete().eq('id',id);

  if(error){
    alert('خطأ الحذف: ' + error.message);
    return;
  }

  await loadProducts();
}

(async function init(){
  if(await checkAdmin()){
    await loadProducts();
  }
})();
</script>
</body>
</html>
